name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Vet and test
        working-directory: core
        run: go vet ./... && go test ./...
      - name: Cross-compile CLI
        working-directory: core
        run: |
          mkdir -p ../out
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${t%/*}; ar=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$ar go build -trimpath -ldflags "-s -w" -o ../out/onetouch-$os-$ar$ext ./cmd/onetouch
          done
      - uses: actions/upload-artifact@v4
        with:
          name: onetouch-cli
          path: out/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and build APK
        working-directory: android
        run: ./gradlew --no-daemon lintRelease assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../OneTouch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: onetouch-android
          path: OneTouch.apk

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Build OneTouch.app
        run: sh macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: onetouch-mac
          path: macos/build/OneTouch-mac.zip

  release:
    if: github.event_name == 'push'
    needs: [core, android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rel
          merge-multiple: true
      - name: Publish "latest-build" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=latest-build
          [ "${GITHUB_REF_TYPE}" = tag ] && TAG="${GITHUB_REF_NAME}"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" rel/* --target "$GITHUB_SHA" --prerelease \
            --title "OneTouch — последняя сборка" \
            --notes "Mac: OneTouch-mac.zip · Android: OneTouch.apk · Windows/Linux CLI: onetouch-*. Сборка ${GITHUB_SHA::7}."
