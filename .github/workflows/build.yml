name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Cross-compile
        working-directory: core
        run: |
          mkdir -p ../out
          for t in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${t%/*}; ar=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$ar go build -trimpath -ldflags "-s -w" -o ../out/onetouch-$os-$ar$ext ./cmd/onetouch
          done
      - uses: actions/upload-artifact@v4
        with:
          name: onetouch-desktop
          path: out/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test
        working-directory: app
        run: flutter test
      - name: Build APK
        working-directory: app
        run: flutter build apk --release && cp build/app/outputs/flutter-apk/app-release.apk ../OneTouch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: onetouch-android
          path: OneTouch.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rel
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
